<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Sifa Fauziah</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #d9f0ff, #ffffff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 40px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2878b8;
            margin-bottom: 12px;
            font-size: 30px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .menu a {
            text-decoration: none;
            background: #e8f5ff;
            color: #2878b8;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #c5e5fa;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #2878b8;
            color: white;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 30px;
            color: #888;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to My Portfolio</h1>

        <p class="subtitle">
            Halo! Selamat datang di halaman utama portofolio saya.
            Silakan pilih dokumen yang ingin kamu lihat.
        </p>

        <div class="menu">

            <a href="https://docs.google.com/document/d/1rMJtB-OCOjf9weOw-ESbl_o0yK095mTvnTBhOA_khYg/edit?usp=drivesdk" target="_blank">
                📄 Surat Lamaran Kerja
            </a>

            <a href="https://sifauu2009-beep.github.io/CV-Sifa-fauziahh/" target="_blank">
                👩‍💻 CV Website
            </a>

            <a href="https://canva.link/lbweips1u34o36g" target="_blank">
                📊 CV PPT
            </a>

        </div>

        <footer>
            © 2026 Sifa Fauziah | My Portfolio
        </footer>

    </div>

</body>
</html>
